<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Login - Puntopallone</title>
</head>

<body>
	<div th:replace="~{fragments/header :: header}"></div>

	<h1>Accedi a Puntopallone</h1>

	<!-- Messaggio di errore se la login fallisce -->
	<div th:if="${param.error}" style="color:red;">
		Username o password non validi.
	</div>
	
	<!-- Messaggio di successo della registrazione -->
	<div th:if="${param.registerSuccess}" style="color:green;">
	    Registrazione completata! Ora puoi accedere.
	</div>

	<form th:action="@{/login}" method="POST">
		<!-- Token CSRF -->
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

		<div>
			<label for="username">Username:</label>
			<input type="text" id="username" name="username" required autofocus />
		</div>
		<div>
			<label for="password">Password:</label>
			<input type="password" id="password" name="password" required />
		</div>
		<div>
			<button type="submit">Entra</button>
		</div>
	</form>

	<p>Non hai un account? <a th:href="@{/register}">Registrati</a></p>
</body>

</html>
