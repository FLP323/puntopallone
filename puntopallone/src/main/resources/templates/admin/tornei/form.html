<!DOCTYPE html>
<html>
<head>
    <title th:text="${torneo.id == null ? 'Nuovo Torneo' : 'Modifica Torneo'}"></title>
</head>
<body>
    <h1 th:text="${torneo.id == null ? 'Crea Torneo' : 'Modifica Torneo'}"></h1>
    <form th:action="@{${torneo.id == null ? '/admin/tornei' : '/admin/tornei/' + torneo.id + '/edit'}}" 
          th:object="${torneo}" method="POST">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        
        <!-- Nome -->
        <div>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" th:field="*{nome}" required />
            <span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color:red"></span>
        </div>
        
        <!-- Anno -->
        <div>
            <label for="anno">Anno:</label>
            <input type="number" id="anno" th:field="*{anno}" required min="1871" />
            <span th:if="${#fields.hasErrors('anno')}" th:errors="*{anno}" style="color:red"></span>
        </div>
        
        <!-- Descrizione -->
        <div>
            <label for="descrizione">Descrizione:</label>
            <textarea id="descrizione" th:field="*{descrizione}"></textarea>
        </div>
        
        <!-- Squadre partecipanti -->
        <div>
            <label for="squadre">Squadre partecipanti:</label>
            <select id="squadre" name="squadreIds" multiple size="6">
                <option th:each="squadra : ${squadreDisponibili}" 
                        th:value="${squadra.id}" 
                        th:text="${squadra.nome}"
                        th:selected="${torneo.squadrePartecipanti != null and torneo.squadrePartecipanti.contains(squadra)}">
                </option>
            </select>
            <small>Tieni premuto Ctrl (o Cmd) per selezionare più squadre.</small>
        </div>
        
        <button type="submit">Salva</button>
    </form>
	<div th:replace="~{fragments/footer :: adminfooter}"></div>
</body>
</html>
