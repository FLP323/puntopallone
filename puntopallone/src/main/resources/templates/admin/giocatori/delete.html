<!DOCTYPE html>
<html>
<head><title>Conferma eliminazione</title></head>
<body>
    <h1>Sei sicuro di voler eliminare il giocatore "<span th:text="${giocatore.nome} + ' ' + ${giocatore.cognome}"></span>"?</h1>
    <form th:action="@{'/admin/giocatori/' + ${giocatore.id} + '/delete'}" method="POST">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit">Sì, elimina</button>
        <a th:href="@{/admin/giocatori}">Annulla</a>
    </form>
	<div th:replace="~{fragments/footer :: adminfooter}"></div>
</body>
</html>
