<!DOCTYPE html>
<html>

<head>
	<link rel="stylesheet" th:href="@{/css/style.css}" />
	<title th:text="${giocatore.id == null ? 'Nuovo Giocatore' : 'Modifica Giocatore'}"></title>
</head>

<body>
	<h1 th:text="${giocatore.id == null ? 'Crea Giocatore' : 'Modifica Giocatore'}"></h1>
	<form th:action="@{${giocatore.id == null ? '/admin/giocatori' : '/admin/giocatori/' + giocatore.id + '/edit'}}"
		th:object="${giocatore}" method="POST">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

		<div>
			<label for="nome">Nome:</label>
			<input type="text" id="nome" th:field="*{nome}" required />
			<span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color:red"></span>
		</div>
		<div>
			<label for="cognome">Cognome:</label>
			<input type="text" id="cognome" th:field="*{cognome}" required />
			<span th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}" style="color:red"></span>
		</div>
		<div>
			<label for="dataDiNascita">Data di nascita:</label>
			<input type="date" id="dataDiNascita" th:field="*{dataDiNascita}" required />
			<span th:if="${#fields.hasErrors('dataDiNascita')}" th:errors="*{dataDiNascita}" style="color:red"></span>
		</div>
		<div>
			<label for="ruolo">Ruolo:</label>
			<select id="ruolo" th:field="*{ruolo}" required>
				<option value="">Seleziona un ruolo</option>
				<option th:each="ruolo : ${T(it.ur3.siw.model.enums.PlayerRole).values()}" th:value="${ruolo.name()}"
					th:text="${ruolo.getDescription() + ' (' + ruolo.getCode() + ')'}"></option>
			</select>
			<span th:if="${#fields.hasErrors('ruolo')}" th:errors="*{ruolo}" style="color:red"></span>
		</div>
		<div>
			<label for="altezza">Altezza (cm):</label>
			<input type="number" id="altezza" th:field="*{altezza}" required min="0" />
			<span th:if="${#fields.hasErrors('altezza')}" th:errors="*{altezza}" style="color:red"></span>
		</div>
		<div>
			<label for="squadraId">Squadra:</label>
			<select id="squadraId" name="squadraId">
				<option value="">Nessuna squadra</option>
				<option th:each="squadra : ${squadre}" th:value="${squadra.id}" th:text="${squadra.nome}"
					th:selected="${giocatore.squadraDiAppartenenza != null and giocatore.squadraDiAppartenenza.id == squadra.id}">
				</option>
			</select>
		</div>

		<button type="submit">Salva</button>
	</form>
	<div th:replace="~{fragments/footer :: adminfooter}"></div>
</body>

</html>
