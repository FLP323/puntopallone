<!DOCTYPE html>
<html>

<head>
	<link rel="stylesheet" th:href="@{/css/style.css}" />
	<title th:text="${squadra.id == null ? 'Nuova Squadra' : 'Modifica Squadra'}"></title>
</head>

<body>
	<h1 th:text="${squadra.id == null ? 'Crea Squadra' : 'Modifica Squadra'}"></h1>
	<form th:action="@{${squadra.id == null ? '/admin/squadre' : '/admin/squadre/' + squadra.id + '/edit'}}"
		th:object="${squadra}" method="POST">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

		<div>
			<label for="nome">Nome:</label>
			<input type="text" id="nome" th:field="*{nome}" required />
			<span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" style="color:red"></span>
		</div>

		<div>
			<label for="annoDiFondazione">Anno di fondazione:</label>
			<input type="number" id="annoDiFondazione" th:field="*{annoDiFondazione}" required min="1857" />
			<span th:if="${#fields.hasErrors('annoDiFondazione')}" th:errors="*{annoDiFondazione}"
				style="color:red"></span>
		</div>

		<div>
			<label for="città">Città:</label>
			<input type="text" id="città" th:field="*{città}" required />
			<span th:if="${#fields.hasErrors('città')}" th:errors="*{città}" style="color:red"></span>
		</div>

		<button type="submit">Salva</button>
	</form>
	<div th:replace="~{fragments/footer :: adminfooter}"></div>
</body>

</html>
